[project]
name = "storyclips"
version = "0.1.0"
description = "Videos verticales de historias originales con voz en off sobre tus propios videos de fondo"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.27", "tzdata>=2024.1"]

[project.optional-dependencies]
# Voz local con Kokoro (ONNX, CPU). Se instala aparte porque arrastra onnxruntime y numpy.
tts = ["kokoro-onnx>=0.3", "numpy>=1.26"]
# Subida a YouTube (google-api-python-client + OAuth de escritorio).
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]

[project.scripts]
storyclips = "storyclips.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storyclips"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S603", "S607", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
